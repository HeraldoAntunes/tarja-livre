# Assina os anexos de cada release (o HTML do Tarja Livre e o SHA256SUMS) com o Sigstore, sem chave guardada: a
# assinatura diz "estes bytes foram publicados na release <tag> deste repositório por este workflow".
# Cada anexo ganha um <nome>.sigstore.json ao lado, e a release ganha um atestado de origem (SLSA) de todos os
# anexos, no formato in-toto (<repositório>-<tag>.intoto.jsonl), que também fica registrado no GitHub
# (gh attestation verify). Roda sozinho ao publicar uma release; pelo botão "Run workflow"
# assina uma release já publicada (informar a tag). Não refaz o build: assina os arquivos como estão na release.
name: Assinar release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release já publicada (ex.: v1.10.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: assinar-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  assinar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # anexar as assinaturas à release
      id-token: write   # identidade do workflow para o certificado do Sigstore
      attestations: write   # registrar o atestado de origem no GitHub
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Baixar os anexos da release
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag inválida: $TAG"; exit 1 ;; esac
          mkdir anexos
          gh release download "$TAG" --dir anexos
          rm -f anexos/*.sigstore.json anexos/*.intoto.jsonl   # assinatura e atestado antigos são refeitos
          ls -l anexos

      - name: Atestado de origem (SLSA) dos anexos
        id: atestado
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: anexos/*

      - name: Guardar o atestado como .intoto.jsonl
        env:
          BUNDLE: ${{ steps.atestado.outputs.bundle-path }}
        run: |
          mkdir proveniencia
          jq -c . "$BUNDLE" > "proveniencia/${GH_REPO#*/}-${TAG}.intoto.jsonl"
          ls -l proveniencia

      - name: Assinar cada anexo
        working-directory: anexos
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Conferir as assinaturas
        working-directory: anexos
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GH_REPO}/.github/workflows/assinar-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done

      - name: Anexar à release
        run: gh release upload "$TAG" anexos/*.sigstore.json proveniencia/*.intoto.jsonl --clobber
