# CodeQL: procura falhas de segurança no JavaScript e no Python a cada envio ao main e toda semana.
# As bibliotecas de terceiros (vendor/) ficam de fora: são cópias sem alteração, conferidas a cada versão.
# O resultado aparece na aba Security.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          config: |
            paths-ignore:
              - vendor

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.linguagem }}
