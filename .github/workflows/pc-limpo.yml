# "PC limpo": numa máquina Windows recém-criada pelo GitHub (nada do computador do autor), monta o exe portátil e
# roda tests/pc_limpo.ps1, que confere quatro cenários com captura de tela de cada um:
#   normal       o exe abre, fica vivo e mostra a janela; mede as conexões de todos os processos dele;
#   sem internet o exe e o WebView2 barrados no firewall da máquina descartável: o programa abre e fica vivo;
#   sem WebView2 o carregador aponta para uma pasta vazia: tem de aparecer a mensagem que explica e oferece o HTML;
#   instalar     `--instalar` cria a pasta, os atalhos e a entrada em Aplicativos instalados; o instalado abre a janela;
#                `--desinstalar --silencioso` tira tudo.
# Cada cenário espera a janela ficar desenhada e recusa janela branca. Depois, um teste de ponta a ponta abre um PDF
# dentro do exe, tarja, salva e confere o PDF salvo (tests/e2e.mjs com TARJA_EXE).
# Pelo botão "Run workflow", com a versão (ex.: 1.2.1), testa o exe PUBLICADO dessa versão, baixado da release e
# conferido pelo SHA256SUMS, em vez de um montado na hora (que tem outro SHA-256).
# As capturas e o relatório (pc-limpo.json) ficam como artefato da execução. Nada é publicado por aqui.
name: PC limpo

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão publicada a testar (ex.: 1.2.1); vazio monta o exe do código"
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pc-limpo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-limpo:
    strategy:
      fail-fast: false
      matrix:
        windows: [windows-latest, windows-2022]
    runs-on: ${{ matrix.windows }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Montar o exe portátil
        if: ${{ !inputs.versao }}
        run: python -X utf8 scripts/montar.py --release

      - name: Baixar o exe publicado e conferir o SHA-256
        if: ${{ inputs.versao }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          gh release download "v$env:VERSAO" --repo $env:GITHUB_REPOSITORY --dir dist/release --pattern "Instalar-TarjaLivre-$env:VERSAO.zip" --pattern SHA256SUMS.txt
          $esperado = (Select-String -Path dist/release/SHA256SUMS.txt -Pattern "Instalar-TarjaLivre-$env:VERSAO.zip").Line.Split(' ')[0]
          $achado = (Get-FileHash "dist/release/Instalar-TarjaLivre-$env:VERSAO.zip" -Algorithm SHA256).Hash.ToLower()
          if ($esperado -ne $achado) { throw "SHA-256 diferente: $achado, esperado $esperado" }
          "zip publicado conferido: $achado"

      - name: Extrair o exe do zip de instalação, como o professor faz
        shell: pwsh
        run: Expand-Archive (Get-ChildItem dist/release/Instalar-TarjaLivre-*.zip | Select-Object -First 1).FullName -DestinationPath dist/release -Force

      - name: Rodar como um professor rodaria
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/pc_limpo.ps1
          -Exe (Get-ChildItem dist/release/TarjaLivre-*.exe | Select-Object -First 1).FullName
          -Saida pc-limpo -Segundos 90 -BloquearRede -Instalar

      - name: Abrir um PDF, tarjar e salvar dentro do exe
        shell: pwsh
        run: |
          $env:TARJA_EXE = (Get-ChildItem dist/release/TarjaLivre-*.exe | Select-Object -First 1).FullName
          node tests/e2e.mjs pc-limpo/e2e

      - name: Juntar o janelas.log do exe (o que ele anotou ao criar a janela)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pc-limpo | Out-Null
          # o do e2e (perfil em %TEMP%) e o do perfil normal, que o pc_limpo.ps1 usa
          $logs = @{ 'janelas-e2e.log' = (Join-Path $env:TEMP 'janelas.log'); 'janelas-normal.log' = (Join-Path $env:LOCALAPPDATA 'br.tarjalivre.app/janelas.log') }
          foreach ($nome in $logs.Keys) {
            if (Test-Path $logs[$nome]) { Copy-Item $logs[$nome] "pc-limpo/$nome"; "== $nome"; Get-Content $logs[$nome] } else { "sem $nome" }
          }

      - name: Guardar capturas e relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-limpo-${{ matrix.windows }}
          path: pc-limpo/
          retention-days: 30
