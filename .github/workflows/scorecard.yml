# Nota de segurança do OpenSSF Scorecard: roda toda semana e a cada envio ao main, publica o resultado
# (é o que alimenta o selo do README) e manda o relatório para a aba Security do GitHub.
# As actions ficam fixadas pelo hash do commit, com a versão no comentário, como o Scorecard recomenda.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analise:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Análise do Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: resultado.sarif
          results_format: sarif
          publish_results: true

      - name: Guardar o relatório
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF
          path: resultado.sarif
          retention-days: 5

      - name: Enviar para a aba Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: resultado.sarif
