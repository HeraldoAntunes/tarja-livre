# Testes automáticos a cada envio ao GitHub, num Windows com o Microsoft Edge (o mesmo que o programa usa): monta o
# HTML único nas duas versões (normal e com OCR) e roda a suíte inteira pelo tests/todos.py: os testes da procura,
# do montador e dos dados fictícios, todos os de ponta a ponta (abrem o arquivo direto do disco no Edge sem janela,
# incluindo os das auditorias, a recuperação depois de quedas e a exportação conferida pelo PyMuPDF) e os testes da
# auditoria externa (tests/auditoria-ext). Nada é publicado por aqui. NÃO roda a parte longa nem a do Windows de
# verdade da bateria (só na máquina do professor, no exe exato): e2e_longo (30 min, Warsaw), conexões 5 × 10 min,
# e2e_fechar e os .ps1 (janela, quedas, instalar e atualizar), nem o cargo test; um badge verde não cobre esses.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Montar o HTML único
        run: python -X utf8 scripts/montar.py --release

      - name: Dependências dos testes (PyMuPDF e numpy para conferir os pixels; as da auditoria externa e o fast-check, pelo package-lock)
        run: |
          python -m pip install pymupdf==1.27.2.3 numpy==2.4.4
          npm ci --ignore-scripts --prefix tests/auditoria-ext/ampliada
          npm ci --ignore-scripts --prefix tests/propriedades

      - name: Suíte inteira (tests/todos.py)
        run: python -X utf8 tests/todos.py
